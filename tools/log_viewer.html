<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FOC 日志分析</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#12151b; --panel:#1a1f28; --line:#2a313d; --text:#d7dde8; --dim:#8590a2; --grid:#262d38; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  select, button, .btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 10px; font:inherit; cursor:pointer; }
  button:hover, .btn:hover { border-color:#4a5568; }
  main { padding:12px 18px 40px; max-width:1500px; margin:0 auto; }
  details.input { background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:12px; }
  details.input > summary { cursor:pointer; padding:8px 12px; font-weight:600; user-select:none; }
  details.input .body { padding:0 12px 12px; }
  textarea { width:100%; height:150px; resize:vertical; background:#0f1217; color:#c9d1d9; border:1px solid var(--line); border-radius:4px;
             padding:8px; font:12px/1.45 Consolas,monospace; white-space:pre; overflow:auto; }
  textarea:focus { outline:1px solid #4a6fa5; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .status { color:var(--dim); } .status.ok { color:#68d391; } .status.err { color:#fc8181; }
  body.drag::after { content:"松开鼠标载入日志文件"; position:fixed; inset:0; background:rgba(26,31,40,.88); display:flex; align-items:center; justify-content:center;
                     font-size:26px; border:3px dashed #4a6fa5; z-index:50; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin-bottom:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  .card .k { color:var(--dim); font-size:12px; } .card .v { font-size:17px; font-weight:600; }
  .card .s { color:var(--dim); font-size:11px; }
  .card.warn { border-color:#b7791f; } .card.warn .v { color:#f6ad55; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:10px; padding:6px 8px 4px; }
  .phead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:0 2px 2px; }
  .phead .title { font-weight:600; }
  .chip { display:inline-flex; align-items:center; gap:5px; cursor:pointer; user-select:none; color:var(--text); }
  .chip i { width:14px; height:3px; display:inline-block; border-radius:2px; }
  .chip.off { opacity:.35; text-decoration:line-through; }
  canvas { width:100%; display:block; cursor:crosshair; }
  #tip { position:fixed; pointer-events:none; background:rgba(10,12,16,.92); border:1px solid #3a4352; border-radius:5px;
         padding:6px 9px; font-size:12px; display:none; z-index:10; white-space:pre; font-family:Consolas,monospace; }
  table { border-collapse:collapse; width:100%; font-family:Consolas,monospace; font-size:12px; }
  th, td { text-align:right; padding:2px 10px; border-bottom:1px solid var(--line); } th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:500; }
  .hint { color:var(--dim); font-size:12px; margin:6px 0 10px; }
  .plist { color:var(--dim); font-family:Consolas,monospace; font-size:12px; }
  .plist b { color:var(--text); font-weight:500; }
  .empty { color:var(--dim); text-align:center; padding:50px 10px; line-height:2; }
  .empty code { background:#0f1217; padding:1px 6px; border-radius:3px; color:#c9d1d9; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>FOC 日志分析</h1>
  <label class="hidden" id="sessBox">记录 <select id="sess"></select></label>
  <button id="reset" class="hidden">复位视图</button>
</header>
<main>
  <details class="input" id="inputBox" open>
    <summary>日志输入（直接粘贴，自动解析）</summary>
    <div class="body">
      <textarea id="paste" spellcheck="false" placeholder="把串口日志整段粘贴到这里 (Ctrl+V)，也可以把日志文件拖进页面。
支持夹杂 shell 回显等其他内容，只会提取 flog 的 CSV 数据行：
ms,target,planned,angle,vel,vel_sp,uq
12000,2.000,0.512,0.498,1.203,1.500,0.812"></textarea>
      <div class="bar">
        <button id="btnParse">解析</button>
        <button id="btnClear">清空</button>
        <button id="btnDemo">载入示例</button>
        <label class="btn">选择文件…<input type="file" id="file" accept=".txt,.log,.csv,text/*" style="display:none"></label>
        <span class="status" id="status">等待输入…</span>
      </div>
    </div>
  </details>

  <div id="empty" class="empty">
    还没有数据。在上方粘贴 <code>flog</code> 的日志，或点击“载入示例”看看效果。<br>
    板子上：<code>flog 20</code> 开始记录 → 做动作 → <code>flog off</code>，把串口输出整段复制过来即可。
  </div>

  <div id="report" class="hidden">
    <div class="cards" id="cards"></div>
    <div class="hint">滚轮：以鼠标位置缩放时间轴　拖动：平移　双击：复位　点击图例：开关曲线　黄色虚线：命令/参数事件</div>
    <div id="panels"></div>
    <div class="panel"><div class="phead"><span class="title">可见区间统计</span><span class="chip" style="cursor:default" id="rangeLabel"></span></div>
      <table id="stats"></table></div>
    <div class="panel" id="paramBox"><div class="phead"><span class="title">日志中出现的命令 / 参数</span></div><div class="plist" id="plist"></div></div>
  </div>
</main>
<div id="tip"></div>
<script>
/* 由 tools/log_viewer.py 生成时会把日志文本注入到这里 */
const PRELOAD = null;

// ============================================================================ 解析
const COLUMNS = ["ms","target","planned","angle","vel","vel_sp","uq"];
const NUM = "-?\\d+(?:\\.\\d+)?";
const ROW_RE   = new RegExp("(?<![\\d.,\\-])(\\d+)" + ("," + "(" + NUM + ")").repeat(6) + "(?![\\d.])");
const HEADER_RE = /ms,target,planned,angle,vel,vel_sp,uq/;
const ANSI_RE   = /\x1b\[[0-9;?]*[A-Za-z]/g;
const ANSI_LOST_RE = /\[\d{1,3}(?:;\d{1,3})*m/g;     // 复制时 ESC 被丢掉后残留的 "[32m"
const CMD_RE    = /msh\s*>\s*(angle|traj|tune|flog|speed)\b\s*(.*)$/;
const TUNE_RE   = /^\s*(ap|vp|vi|vd|vtf|vlim|vramp)\s*=\s*(-?\d+(?:\.\d+)?)\s*(.*)$/;
const TRAJ_RE   = /traj\s+(on|off):\s*vmax\s+(-?[\d.]+)\s*rad\/s,\s*amax\s+(-?[\d.]+)\s*rad\/s\^2,\s*smooth\s+(-?[\d.]+)\s*ms,\s*vff\s+(-?[\d.]+)/;

/* 逐行解析：返回 {sessions, skipped, totalRows}
 * 新记录的起点：flog 表头 / 时间戳回退 / 没有表头就遇到数据行。
 * 命令回显与参数行没有时间戳，挂靠到其后的第一条数据行。 */
function parseLog(text) {
  const sessions = []; let cur = null, skipped = 0, pendingEv = [], pendingPa = [];
  const start = () => { sessions.push({rows:[], events:[], params:[]}); cur = sessions[sessions.length-1]; };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(ANSI_RE, "").replace(ANSI_LOST_RE, "");
    if (HEADER_RE.test(line)) { start(); continue; }
    let m = ROW_RE.exec(line);
    if (m) {
      const v = m.slice(1, 8).map(Number);
      if (!cur || (cur.rows.length && v[0] < cur.rows[cur.rows.length-1][0])) start();
      for (const t of pendingEv) cur.events.push({row:cur.rows.length, text:t});
      for (const t of pendingPa) cur.params.push({row:cur.rows.length, text:t});
      pendingEv = []; pendingPa = [];
      cur.rows.push(v); continue;
    }
    if ((m = CMD_RE.exec(line)))  {
      const text = (m[1]+" "+m[2]).trim();
      if (m[1]==="flog" && /^off\b/.test(m[2].trim()) && cur) cur.events.push({row:cur.rows.length, text});   // 属于刚结束的这段记录
      else pendingEv.push(text);
      continue; }
    if ((m = TUNE_RE.exec(line))) { pendingPa.push(m[1]+"="+m[2]); continue; }
    if ((m = TRAJ_RE.exec(line))) { pendingPa.push("traj "+m[1]+" vmax="+m[2]+" amax="+m[3]+" smooth="+m[4]+"ms vff="+m[5]); continue; }
    if (line.trim()) skipped++;
  }
  const good = sessions.filter(s => s.rows.length >= 2);
  return {sessions: good, skipped, totalRows: good.reduce((a,s)=>a+s.rows.length, 0)};
}

function buildSession(s, idx) {
  const rows = s.rows, ms0 = rows[0][0], n = rows.length;
  const c = {t: rows.map(r => Math.round((r[0]-ms0))/1000)};
  COLUMNS.slice(1).forEach((name, i) => { c[name] = rows.map(r => r[i+1]); });
  const at = row => c.t[Math.min(row, n-1)];
  c.events = s.events.map(e => ({t: at(e.row), text: e.text}));
  c.params = s.params.map(p => ({t: at(p.row), text: p.text}));
  c.label = "记录 "+(idx+1)+"  ("+n+" 点, "+c.t[n-1].toFixed(1)+" s)";
  c.stats = computeStats(c);
  return c;
}

// ============================================================================ 统计
function fftInPlace(re, im) {
  const n = re.length;
  for (let i=1, j=0; i<n; i++) { let bit = n>>1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
    if (i < j) { [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; } }
  for (let len=2; len<=n; len<<=1) {
    const ang = -2*Math.PI/len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i=0; i<n; i+=len) { let cr=1, ci=0;
      for (let k=0; k<len/2; k++) {
        const a=i+k, b=i+k+len/2, tr=re[b]*cr-im[b]*ci, ti=re[b]*ci+im[b]*cr;
        re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti;
        const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr; } } }
}

/* 线性重采样到等间隔后做汉宁窗 FFT，返回 {freq, amp, nyquist}；数据不足返回 null。取最后一段(更关注稳态/振荡段) */
function dominantFreq(t, y) {
  const n = t.length; if (n < 32) return null;
  const dts = []; for (let i=0;i<n-1;i++) if (t[i+1] > t[i]) dts.push(t[i+1]-t[i]);
  if (!dts.length) return null; dts.sort((a,b)=>a-b);
  const dt = dts[dts.length>>1]; if (dt <= 0) return null;
  const m = Math.floor((t[n-1]-t[0])/dt)+1; let size = 1; while (size*2 <= Math.min(m, 8192)) size *= 2;
  if (size < 32) return null;
  const t0 = t[n-1] - (size-1)*dt, yy = new Array(size); let j = 0;
  for (let i=0;i<size;i++) { const ti = t0 + i*dt;
    while (j+1 < n-1 && t[j+1] < ti) j++;
    const a = t[j+1]===t[j] ? 0 : Math.min(Math.max((ti-t[j])/(t[j+1]-t[j]),0),1);
    yy[i] = y[j]*(1-a) + y[j+1]*a; }
  const mean = yy.reduce((p,q)=>p+q,0)/size, re = new Float64Array(size), im = new Float64Array(size);
  for (let i=0;i<size;i++) re[i] = (yy[i]-mean)*(0.5-0.5*Math.cos(2*Math.PI*i/(size-1)));
  fftInPlace(re, im);
  let bk=0, bm=0; for (let k=1;k<size/2;k++) { const mag=Math.hypot(re[k],im[k]); if (mag>bm) { bm=mag; bk=k; } }
  if (!bk) return null;
  return {freq: bk/(size*dt), amp: 2*bm/(size*0.5), nyquist: 0.5/dt};
}

function computeStats(c) {
  const t=c.t, n=t.length, err = c.planned.map((p,i)=>p-c.angle[i]), st = {n, duration:t[n-1]-t[0]};
  const dts = []; for (let i=0;i<n-1;i++) dts.push(t[i+1]-t[i]); dts.sort((a,b)=>a-b);
  st.dt_median_ms = dts[dts.length>>1]*1000; st.dt_max_ms = dts[dts.length-1]*1000;
  st.err_rms = Math.sqrt(err.reduce((a,e)=>a+e*e,0)/n); st.err_max = Math.max(...err.map(Math.abs));
  const tail = err.slice(Math.floor(n*0.9)); st.err_final = tail.reduce((a,e)=>a+e,0)/tail.length;
  const still = []; for (let i=3;i<n-3;i++) if (Math.abs(c.planned[i+3]-c.planned[i-3]) < 1e-3) still.push(err[i]);
  if (still.length >= 5) { const m = still.reduce((a,e)=>a+e,0)/still.length;
    st.still_n = still.length; st.still_rms = Math.sqrt(still.reduce((a,e)=>a+(e-m)*(e-m),0)/still.length);
    st.still_p2p = Math.max(...still)-Math.min(...still); }
  for (const key of ["vel_sp","uq","vel"]) { let peak = 0; for (const v of c[key]) peak = Math.max(peak, Math.abs(v));
    st[key+"_peak"] = peak;
    if (peak > 1e-6) st[key+"_sat_pct"] = 100*c[key].filter(v=>Math.abs(v)>=0.98*peak).length/n; }
  const f = dominantFreq(t, err); if (f) { st.osc_freq=f.freq; st.osc_amp=f.amp; st.nyquist=f.nyquist; }
  return st;
}

// ============================================================================ 绘图
const PANELS = [
  { title:"角度 (rad)", series:[
      {key:"target",  name:"target 目标",   color:"#a0aec0", dash:[6,4]},
      {key:"planned", name:"planned 规划",  color:"#63b3ed"},
      {key:"angle",   name:"angle 实际",    color:"#f6ad55"} ]},
  { title:"跟踪误差 planned - angle (rad)", series:[
      {key:"err",     name:"误差",          color:"#fc8181", derived:(d,i)=>d.planned[i]-d.angle[i]} ], zero:true },
  { title:"速度 (rad/s)", series:[
      {key:"vel",     name:"vel 实际",      color:"#68d391"},
      {key:"vel_sp",  name:"vel_sp 位置环输出", color:"#b794f4"} ], zero:true },
  { title:"q 轴电压 uq (V)", series:[
      {key:"uq",      name:"uq",            color:"#f687b3"} ], zero:true },
];

let DATA = {sessions:[]}, sess = null, view = {x0:0, x1:1}, hoverT = null;
const hidden = {}, canvases = [], cache = new Map();
const MARGIN = {l:62, r:14, t:6, b:22}, PANEL_H = 200;
const $ = id => document.getElementById(id);

function getSeries(s) { if (!s.derived) return sess[s.key];
  if (!cache.has(s.key)) cache.set(s.key, sess.t.map((_,i)=>s.derived(sess,i))); return cache.get(s.key); }
function lowerBound(arr, v) { let lo=0, hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<v) lo=m+1; else hi=m;} return lo; }
function niceStep(range, target) { const raw=range/target, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }
function fmt(v, step) { return v.toFixed(Math.max(0, Math.min(6, -Math.floor(Math.log10(step||1))))); }

function drawPanel(pi) {
  const P = PANELS[pi], cv = canvases[pi], dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = PANEL_H;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)) { cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.height = H+"px"; }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const pw = W-MARGIN.l-MARGIN.r, ph = H-MARGIN.t-MARGIN.b;
  const t = sess.t, i0 = Math.max(0, lowerBound(t, view.x0)-1), i1 = Math.min(t.length-1, lowerBound(t, view.x1));
  const X = x => MARGIN.l + (x-view.x0)/(view.x1-view.x0)*pw;

  let ymin=Infinity, ymax=-Infinity; const vis = [];
  for (const s of P.series) { if (hidden[s.key]) continue; const a = getSeries(s); vis.push([s,a]);
    for (let i=i0;i<=i1;i++){ const v=a[i]; if(v<ymin)ymin=v; if(v>ymax)ymax=v; } }
  if (!isFinite(ymin)) { ymin=-1; ymax=1; }
  if (P.zero) { ymin=Math.min(ymin,0); ymax=Math.max(ymax,0); }
  if (ymax-ymin < 1e-9) { ymax+=0.5; ymin-=0.5; }
  const pad=(ymax-ymin)*0.08; ymin-=pad; ymax+=pad;
  const Y = y => MARGIN.t + (1-(y-ymin)/(ymax-ymin))*ph;

  g.font = "11px Consolas, monospace"; g.textBaseline="middle";
  const ys = niceStep(ymax-ymin, 5);
  g.strokeStyle="#262d38"; g.fillStyle="#8590a2"; g.lineWidth=1; g.textAlign="right";
  for (let y=Math.ceil(ymin/ys)*ys; y<=ymax; y+=ys) { const py=Math.round(Y(y))+.5;
    g.beginPath(); g.moveTo(MARGIN.l,py); g.lineTo(W-MARGIN.r,py); g.stroke(); g.fillText(fmt(y,ys), MARGIN.l-6, py); }
  const xs = niceStep(view.x1-view.x0, Math.max(4, pw/110)); g.textAlign="center"; g.textBaseline="top";
  for (let x=Math.ceil(view.x0/xs)*xs; x<=view.x1; x+=xs) { const px=Math.round(X(x))+.5;
    g.beginPath(); g.moveTo(px,MARGIN.t); g.lineTo(px,MARGIN.t+ph); g.stroke(); g.fillText(fmt(x,xs)+"s", px, MARGIN.t+ph+4); }
  if (ymin<0 && ymax>0) { g.strokeStyle="#3b4454"; const py=Math.round(Y(0))+.5; g.beginPath(); g.moveTo(MARGIN.l,py); g.lineTo(W-MARGIN.r,py); g.stroke(); }

  g.save(); g.beginPath(); g.rect(MARGIN.l, MARGIN.t, pw, ph); g.clip();
  for (const e of sess.events) { if (e.t<view.x0||e.t>view.x1) continue; const px=Math.round(X(e.t))+.5;
    g.strokeStyle="rgba(250,240,137,.45)"; g.setLineDash([2,3]); g.beginPath(); g.moveTo(px,MARGIN.t); g.lineTo(px,MARGIN.t+ph); g.stroke(); g.setLineDash([]);
    if (pi===0) { g.fillStyle="#faf089"; g.textAlign="left"; g.textBaseline="top"; g.fillText(e.text, px+3, MARGIN.t+2); } }
  for (const [s,a] of vis) {
    g.strokeStyle=s.color; g.lineWidth=1.4; g.setLineDash(s.dash||[]); g.beginPath();
    const n=i1-i0+1;
    if (n > pw*2) {                       // 点很多时按像素列取 min/max
      let started=false;
      for (let px=0; px<pw; px++) {
        const ta=view.x0+px/pw*(view.x1-view.x0), tb=view.x0+(px+1)/pw*(view.x1-view.x0);
        const ja=Math.max(i0,lowerBound(t,ta)), jb=Math.min(i1,lowerBound(t,tb)); if (ja>jb) continue;
        let lo=a[ja], hi=a[ja]; for (let j=ja;j<=jb;j++){ if(a[j]<lo)lo=a[j]; if(a[j]>hi)hi=a[j]; }
        const x=MARGIN.l+px+.5; if(!started){g.moveTo(x,Y(lo));started=true;} else g.lineTo(x,Y(lo)); g.lineTo(x,Y(hi));
      }
    } else { for (let i=i0;i<=i1;i++){ const x=X(t[i]), y=Y(a[i]); i===i0?g.moveTo(x,y):g.lineTo(x,y); } }
    g.stroke(); g.setLineDash([]);
    if (n <= pw/4) { g.fillStyle=s.color; for (let i=i0;i<=i1;i++){ g.beginPath(); g.arc(X(t[i]),Y(a[i]),1.8,0,6.3); g.fill(); } }
  }
  g.restore();
  if (hoverT!==null && hoverT>=view.x0 && hoverT<=view.x1) { const px=Math.round(X(hoverT))+.5;
    g.strokeStyle="rgba(215,221,232,.5)"; g.beginPath(); g.moveTo(px,MARGIN.t); g.lineTo(px,MARGIN.t+ph); g.stroke(); }
  g.strokeStyle="#3b4454"; g.strokeRect(MARGIN.l+.5, MARGIN.t+.5, pw, ph);
}
function drawAll(){ if (!sess) return; PANELS.forEach((_,i)=>drawPanel(i)); updateStats(); }

// ============================================================================ 交互
function xToT(cv, clientX) { const r=cv.getBoundingClientRect(), pw=r.width-MARGIN.l-MARGIN.r; return view.x0 + (clientX-r.left-MARGIN.l)/pw*(view.x1-view.x0); }
let drag = null;
window.addEventListener("mouseup", ()=>{ drag=null; });
window.addEventListener("mousemove", ev => { if (!drag || !sess) return;
  const r=drag.cv.getBoundingClientRect(), pw=r.width-MARGIN.l-MARGIN.r, dt=-(ev.clientX-drag.x)/pw*(drag.v.x1-drag.v.x0);
  view={x0:drag.v.x0+dt, x1:drag.v.x1+dt}; drawAll(); });

function setupInteraction(cv) {
  cv.addEventListener("wheel", ev => { ev.preventDefault(); if (!sess) return;
    const tc=xToT(cv,ev.clientX), k=Math.exp(ev.deltaY*0.0015), end=sess.t[sess.t.length-1];
    let a=tc-(tc-view.x0)*k, b=tc+(view.x1-tc)*k;
    if (b-a > end-sess.t[0]) { a=sess.t[0]; b=end; }
    if (b-a < 0.02) return; view={x0:a,x1:b}; drawAll(); }, {passive:false});
  cv.addEventListener("mousedown", ev => { drag={x:ev.clientX, v:{...view}, cv}; });
  cv.addEventListener("dblclick", resetView);
  cv.addEventListener("mousemove", ev => { hoverT=xToT(cv,ev.clientX); if(!drag) drawAll(); showTip(ev); });
  cv.addEventListener("mouseleave", ()=>{ hoverT=null; $("tip").style.display="none"; drawAll(); });
}
function showTip(ev) {
  const tip=$("tip"), t=sess.t; let i=lowerBound(t,hoverT);
  if (i>0 && (i>=t.length || hoverT-t[i-1] < t[i]-hoverT)) i--; i=Math.min(i,t.length-1);
  const lines=["t = "+t[i].toFixed(3)+" s"];
  for (const P of PANELS) for (const s of P.series) { if (hidden[s.key]) continue;
    lines.push((s.name.split(" ")[0]+"          ").slice(0,9)+" "+getSeries(s)[i].toFixed(3)); }
  tip.textContent=lines.join("\n"); tip.style.display="block";
  tip.style.left=Math.min(window.innerWidth-190, ev.clientX+14)+"px"; tip.style.top=(ev.clientY+14)+"px";
}
function resetView(){ if (!sess) return; view={x0:sess.t[0], x1:sess.t[sess.t.length-1]}; drawAll(); }

// ============================================================================ 统计/卡片/列表
function updateStats() {
  const t=sess.t, i0=Math.max(0,lowerBound(t,view.x0)), i1=Math.min(t.length-1,lowerBound(t,view.x1));
  $("rangeLabel").textContent = "t = "+view.x0.toFixed(2)+" ~ "+view.x1.toFixed(2)+" s  ("+Math.max(0,i1-i0+1)+" 点)";
  let html="<tr><th>信号</th><th>最小</th><th>最大</th><th>峰峰</th><th>平均</th><th>RMS</th></tr>";
  for (const P of PANELS) for (const s of P.series) {
    const a=getSeries(s); let mn=Infinity,mx=-Infinity,sum=0,sq=0,n=0;
    for (let i=i0;i<=i1;i++){ const v=a[i]; if(v<mn)mn=v; if(v>mx)mx=v; sum+=v; sq+=v*v; n++; }
    if(!n) continue; const f=v=>v.toFixed(4);
    html+="<tr><td style='color:"+s.color+"'>"+s.name+"</td><td>"+f(mn)+"</td><td>"+f(mx)+"</td><td>"+f(mx-mn)+"</td><td>"+f(sum/n)+"</td><td>"+f(Math.sqrt(sq/n))+"</td></tr>";
  }
  $("stats").innerHTML=html;
}
function renderCards() {
  const st=sess.stats, cards=[];
  const add=(k,v,s,warn)=>cards.push('<div class="card'+(warn?' warn':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+(s||"&nbsp;")+'</div></div>');
  add("数据点 / 时长", st.n+" / "+st.duration.toFixed(1)+" s", "采样间隔中位 "+st.dt_median_ms.toFixed(1)+" ms, 最大 "+st.dt_max_ms.toFixed(0)+" ms", st.dt_max_ms>st.dt_median_ms*3);
  add("跟踪误差 RMS", st.err_rms.toFixed(4)+" rad", "最大 "+st.err_max.toFixed(4)+" rad　末段均值 "+st.err_final.toFixed(4));
  if (st.still_rms!==undefined) add("静止段抖动", st.still_p2p.toFixed(4)+" rad p-p", "RMS "+st.still_rms.toFixed(4)+" rad，"+st.still_n+" 点 (规划角度不变时)", st.still_p2p>0.02);
  if (st.osc_freq!==undefined) add("误差主频 (末段)", st.osc_freq.toFixed(2)+" Hz", "幅值约 "+st.osc_amp.toFixed(4)+" rad，奈奎斯特 "+st.nyquist.toFixed(1)+" Hz", st.osc_amp>0.02);
  add("速度给定峰值", st.vel_sp_peak.toFixed(3)+" rad/s", st.vel_sp_sat_pct!==undefined? "接近峰值的点占 "+st.vel_sp_sat_pct.toFixed(1)+"%  (高=位置环饱和)":"", (st.vel_sp_sat_pct||0)>20);
  add("实际速度峰值", st.vel_peak.toFixed(3)+" rad/s", "");
  add("电压 uq 峰值", st.uq_peak.toFixed(3)+" V", st.uq_sat_pct!==undefined? "接近峰值的点占 "+st.uq_sat_pct.toFixed(1)+"%  (高=电压饱和)":"", (st.uq_sat_pct||0)>20);
  $("cards").innerHTML=cards.join("");
}
function renderParams() {
  const box=$("paramBox");
  if (!sess.params.length && !sess.events.length) { box.classList.add("hidden"); return; } box.classList.remove("hidden");
  const all=[...sess.events.map(e=>({t:e.t,text:"命令  "+e.text})), ...sess.params.map(p=>({t:p.t,text:"参数  "+p.text}))].sort((a,b)=>a.t-b.t);
  $("plist").innerHTML=all.map(x=>"<div><b>"+x.t.toFixed(2)+" s</b>　"+x.text.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join("");
}

// ============================================================================ 页面逻辑
function buildPanels() {
  const root=$("panels"); root.innerHTML=""; canvases.length=0;
  PANELS.forEach((P)=>{
    const box=document.createElement("div"); box.className="panel";
    const head=document.createElement("div"); head.className="phead"; head.innerHTML='<span class="title">'+P.title+'</span>';
    for (const s of P.series) { const c=document.createElement("span"); c.className="chip"+(hidden[s.key]?" off":"");
      c.innerHTML='<i style="background:'+s.color+'"></i>'+s.name; c.onclick=()=>{ hidden[s.key]=!hidden[s.key]; c.classList.toggle("off"); drawAll(); }; head.appendChild(c); }
    const cv=document.createElement("canvas"); box.appendChild(head); box.appendChild(cv); root.appendChild(box);
    canvases.push(cv); setupInteraction(cv);
  });
}
function selectSession(i) { sess=DATA.sessions[i]; cache.clear(); renderCards(); renderParams(); resetView(); }

function setStatus(msg, cls) { const s=$("status"); s.textContent=msg; s.className="status"+(cls?" "+cls:""); }

/* 解析文本并刷新整个报告 */
function loadText(text, collapse) {
  if (!text.trim()) { DATA={sessions:[]}; sess=null; $("report").classList.add("hidden"); $("empty").classList.remove("hidden");
    $("sessBox").classList.add("hidden"); $("reset").classList.add("hidden"); setStatus("等待输入…"); return; }
  const r = parseLog(text);
  if (!r.sessions.length) { DATA={sessions:[]}; sess=null; $("report").classList.add("hidden"); $("empty").classList.remove("hidden");
    $("sessBox").classList.add("hidden"); $("reset").classList.add("hidden");
    setStatus("没有找到有效数据行 (期望: ms,target,planned,angle,vel,vel_sp,uq，共 7 列)", "err"); return; }
  DATA = {sessions: r.sessions.map(buildSession)};
  setStatus("解析到 "+DATA.sessions.length+" 段记录，共 "+r.totalRows+" 个数据点，忽略 "+r.skipped+" 行其他内容", "ok");
  const sel=$("sess"); sel.innerHTML="";
  DATA.sessions.forEach((s,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=s.label; sel.appendChild(o); });
  let best=0; DATA.sessions.forEach((s,i)=>{ if (s.stats.n > DATA.sessions[best].stats.n) best=i; });   // 默认显示数据点最多的一段
  sel.value=best;
  $("empty").classList.add("hidden"); $("report").classList.remove("hidden");
  $("sessBox").classList.toggle("hidden", DATA.sessions.length < 2); $("reset").classList.remove("hidden");
  if (!canvases.length) buildPanels();
  selectSession(best);
  if (collapse) $("inputBox").open = false;
}

/* 示例：静止 -> 平滑到 2rad -> 静止 -> 扯电线引起 3Hz 振荡 */
function demoLog() {
  const L = ["msh >flog 20", "ms,target,planned,angle,vel,vel_sp,uq"], g = (s)=>(Math.random()+Math.random()+Math.random()-1.5)*s*0.8;
  let ms = 12000; const row=(tg,pl,an,v,vs,uq)=>{ L.push([ms,tg,pl,an,v,vs,uq].map((x,i)=>i?x.toFixed(3):x).join(",")); ms+=20; };
  const prof = tt => { const s=Math.min(Math.max(tt/1.1,0),1); return 2*(10*s**3-15*s**4+6*s**5); };
  for (let i=0;i<25;i++) row(0,0,g(.001),g(.01),0,g(.02));
  L.push("msh >angle 2");
  for (let i=0;i<60;i++) { const tt=i*0.02, p=prof(tt), v=(prof(tt+.001)-prof(tt-.001))/.002;
    row(2,p,p-0.01*v+g(.001),v*0.97+g(.02),v+0.05*v,0.1*v+g(.03)); }
  for (let i=0;i<40;i++) row(2,2,2+g(.001),g(.01),0,g(.02));
  L.push("msh >tune ap 5");
  for (let i=0;i<110;i++) { const tt=i*0.02, a=0.22*Math.sin(2*Math.PI*3*tt)*(1-Math.exp(-tt*4));
    row(2,2,2+a,0.22*2*Math.PI*3*Math.cos(2*Math.PI*3*tt),Math.max(-5,Math.min(5,-10*a)),Math.max(-6,Math.min(6,-60*a))); }
  L.push("msh >flog off");
  return L.join("\n");
}

(function init(){
  const ta = $("paste"); let timer = null;
  ta.addEventListener("paste", () => setTimeout(()=>loadText(ta.value, true), 0));   // 粘贴后立即解析并收起输入框
  ta.addEventListener("input", () => { clearTimeout(timer); timer=setTimeout(()=>loadText(ta.value, false), 400); });
  $("btnParse").onclick = () => loadText(ta.value, true);
  $("btnClear").onclick = () => { ta.value=""; loadText("", false); $("inputBox").open = true; ta.focus(); };
  $("btnDemo").onclick = () => { ta.value = demoLog(); loadText(ta.value, true); };
  $("reset").onclick = resetView;
  $("sess").onchange = () => selectSession(+$("sess").value);
  window.addEventListener("resize", drawAll);

  const readFile = f => { const rd=new FileReader(); rd.onload=()=>{ ta.value=rd.result; loadText(ta.value, true); }; rd.readAsText(f); };
  $("file").onchange = ev => { if (ev.target.files[0]) readFile(ev.target.files[0]); ev.target.value=""; };
  let dragDepth = 0;
  window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("drag"); });
  window.addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth<=0) { dragDepth=0; document.body.classList.remove("drag"); } });
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => { e.preventDefault(); dragDepth=0; document.body.classList.remove("drag");
    const f = e.dataTransfer.files[0]; if (f) readFile(f); });

  if (PRELOAD) { ta.value = PRELOAD; loadText(PRELOAD, true); }
})();
</script>
